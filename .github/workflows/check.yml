name: Check

# The checks AGENTS.md asks of every change that need neither Docker nor a
# model: types, the tests (shell syntax among them), and the status view
# against a fixture run. The view once showed a live run's green branches as
# queued for over an hour, and nothing here would have noticed.
#
# On Linux and macOS: agents test only in the Linux sandbox, and two tests that
# passed there failed on macOS (BSD `script`, a mise `node` shim) until a
# maintainer ran them by hand. macOS also runs the status view under its own
# bash 3.2, the bash the kit's users have there.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - if: runner.os == 'macOS'
        run: STATUS_BASH=/bin/bash bash test/status.test.sh
