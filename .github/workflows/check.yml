name: Check

# The checks AGENTS.md asks of every change that need neither Docker nor a
# model: types, the tests (shell syntax among them), and the status view
# against a fixture run. The view once showed a live run's green branches as
# queued for over an hour, and nothing here would have noticed.
#
# On Linux and macOS: agents test only in the Linux sandbox, and two tests that
# passed there failed on macOS (BSD `script`, a mise `node` shim) until a
# maintainer ran them by hand. macOS also runs the status view under its own
# bash 3.2, the bash the kit's users have there.

# Push only on main: a branch's pushes are covered by its pull request, and
# running both doubled every job and queued the macOS jobs behind each other.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its running check stale; main keeps
# every run, so each landed commit has its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Arm ran the suite 15-35% faster than x64 at every shard count tried,
        # and 24.04 a little faster than 26.04.
        os: [ubuntu-24.04-arm, macos-latest]
        # The status view checks, then the test files in four shards packed by
        # weight (test/shard.ts). Five jobs is also the free plan's macOS limit.
        part: [status, 1, 2, 3, 4]
    name: ${{ matrix.os }} ${{ matrix.part }}
    runs-on: ${{ matrix.os }}
    # Each test has its own five-minute limit; this stops a hung process
    # holding a runner for the default six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.part == 'status'
        run: pnpm exec tsc --noEmit
      # macOS draws the view under its own bash 3.2 as well. Every frame starts processes, slow to
      # start on macOS, so one run after the other took about four minutes, the slowest job by a
      # minute and a half. Each run is a single-threaded chain of processes, so side by side they
      # share the runner's cores rather than fight for them.
      - parallel:
          - name: Status view
            if: matrix.part == 'status'
            run: bash test/status.test.sh
          - name: Status view on bash 3.2
            if: matrix.part == 'status' && runner.os == 'macOS'
            run: STATUS_BASH=/bin/bash bash test/status.test.sh
      - if: matrix.part != 'status'
        run: pnpm test:shard
        env:
          TEST_SHARD: ${{ matrix.part }}/4
