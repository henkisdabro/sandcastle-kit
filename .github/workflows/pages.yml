name: Pages

# The project website, site/: static files with no build step. It deploys when
# the site changes on main, when a release is published (the page names the
# current version, checked against package.json), or by hand. Always deploy
# main so publishing or rerunning an older release cannot roll the site back.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'herdr/herdr-plugin.toml'
      - 'scripts/version.mjs'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a running one is never cut off half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check release versions
        run: node scripts/version.mjs --check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
